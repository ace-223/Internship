<!DOCTYPE html>
<html lang="en">
<script src="UberScript.js" defer></script>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up or Log in with Uber</title>
    <link rel="stylesheet" href="Signup.css">
  </head>

  <body>

    <!-- Navigation Bar -->
    <section class="nav-bar">
      <h2>Uber</h2>
    </section>

    <!-- Main Content -->
    <section class="content-container">
      <div class="top">
        <h3>What's your phone number or email?</h3>
        <input type="text" placeholder="Enter phone number or email" class="input-container">
        <p class="error-msg"></p>
        <button class="continue-btn">Continue</button>
      </div>
      <div class="divider">
        <hr>or<hr>
      </div>
      <div class="middle">
        <button class="google-btn"><img src="Images-2/google.svg" class="image"> Continue with google</button>
        <button class="apple-btn"><img src="Images-2/apple.svg" class="image"> Continue with apple</button>
      </div>
      <div class="divider">
        <hr>or<hr>
      </div>
      <div class="bottom">
        <button class="qr-code-btn"><img src="Images-2/qr-code.svg" class="image">Log in with QR code</button>
        <p>You consent to receive a verification code by text or Whatsapp. Message and data rates may apply.</p>
      </div>
    </section>
  
  </body>

</html>

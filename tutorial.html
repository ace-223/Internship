<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javascript</title>
</head>
<body>
  <h1>JavaScript</h1>
  
  <div class="nums">
    <h2>Inputs:</h2>
    <p id="demo1">10</p>
    <p>and</p>
    <p id="demo2">3</p>
  </div>

  <div class="results">
    <p id="sum"></p>
    <p id="difference"></p>
    <p id="product"></p>
    <p id="quotient"></p>
    <p id="remainder"></p>
  </div>

  <script src="tutorial.js"></script>

  <style>
    body {
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: auto;
      margin-top: 30px;
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 26px;
      color: #1e3c72;
    }

    h2 {
      font-size: 18px;
    }

    .nums {
      display: flex;
      gap: 30px;
      justify-content: center;
      text-align: center;
      border-radius: 12px;
      font-size: 16px;
      margin: 20px;
    }

    .results p {
      margin: 0 0 10px;
      padding: 12px 16px;
      background: #f7f8fa;
      border-radius: 8px;
      font-size: 16px;
      color: #333;
      border-bottom: 1px solid #0f0f0f;
    }
  </style>
</body>
</html>
